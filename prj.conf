
# ============================================================
# STM32H723ZG + ENC28J60 + BME280
# Zephyr Application Configuration
# ============================================================

# GPIO
CONFIG_GPIO=y

# Logging
CONFIG_LOG=y
# Shell "log" command: per-module levels at run time
# (e.g. `log enable dbg app_sensor` shows the BME280 readings)
CONFIG_LOG_CMDS=y
# The shell backend applies this level to every module when it starts; the
# default ("system limit") would show each module's compiled level, DBG included
CONFIG_SHELL_BACKEND_SERIAL_LOG_LEVEL_INF=y

# ============================================================
# Ethernet Networking - ENC28J60 over SPI1
# ============================================================

CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y

# IPv4
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_ARP=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y

# ============================================================
# HTTP server (static web page)
# ============================================================

CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_VERSION_2=n
# The server polls its eventfd, its listener and every client in one call:
# 1 + 1 + HTTP_SERVER_MAX_CLIENTS (3) = 5. With the default 3, a second client
# made poll() fail with -ENOMEM and the server restarted, dropping everyone.
CONFIG_ZVFS_POLL_MAX=5

# DHCP support
CONFIG_NET_DHCPV4=y

# Network management events
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

# Connection table: one entry per listener, accepted TCP client and bound UDP
# port. Peak use is 7: listeners 80 + 4242, DHCPv4 client (UDP 68), one echo
# client, three HTTP clients. The default 4 allowed only one TCP client at a
# time; further SYNs got RST. 40 B per entry.
CONFIG_NET_MAX_CONN=8

# One IPv4 address per interface
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=1

# Prevent automatic IP configuration by Zephyr's
# network configuration library.
# app_net.c handles static IP or DHCP explicitly.
CONFIG_NET_CONFIG_SETTINGS=n

# Ping (ICMPv4 echo reply) is built into CONFIG_NET_IPV4; no separate symbol

# ============================================================
# Application Network Mode
# ============================================================

# Option 1: Direct PC connection (default)
CONFIG_APP_NET_STATIC=y

# Option 2: Router connection
# CONFIG_APP_NET_DHCP=y

# ============================================================
# Entropy
# ============================================================

CONFIG_ENTROPY_GENERATOR=y

# ============================================================
# BME280 over I2C1
# ============================================================

CONFIG_I2C=y
CONFIG_SENSOR=y

# ============================================================
# Shell for debugging and bring-up
# ============================================================

CONFIG_SHELL=y

# I2C and sensor commands
CONFIG_I2C_SHELL=y
CONFIG_SENSOR_SHELL=y

# Network commands
CONFIG_NET_SHELL=y

# GPIO commands
CONFIG_GPIO_SHELL=y
