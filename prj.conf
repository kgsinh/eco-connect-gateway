# Board defconfig already enables GPIO, UART console (USART3 / ST-Link VCOM)
# and the MPU; GPIO is listed because the app uses it directly.
CONFIG_GPIO=y

# Logging on the console (DHCP lease, errors)
CONFIG_LOG=y

# Networking: IPv4 over the ENC28J60 on SPI1 (10BASE-T). The driver is enabled
# by the enc28j60 devicetree node in the overlay.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_ARP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

# Two IPv4 addresses on the interface: static (direct-to-PC) + DHCP (router).
# Static address/netmask: APP_NET_STATIC_IPV4_* in the app Kconfig.
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=2

# Hardware RNG (&rng) feeds the network stack (DHCP xid, ports)
CONFIG_ENTROPY_GENERATOR=y

# BME280 on I2C1; the driver is enabled by the devicetree node in the overlay
CONFIG_I2C=y
CONFIG_SENSOR=y

# Bring-up commands: "i2c scan i2c@40005400", "sensor get bme280@76"
CONFIG_I2C_SHELL=y
CONFIG_SENSOR_SHELL=y

# Shell on the console for testing: "net iface", "net ping <ip>", "net arp"
CONFIG_SHELL=y
CONFIG_NET_SHELL=y

# Bring-up: drive any pin by hand, e.g. "gpio set gpio@58021800 12 1"
CONFIG_GPIO_SHELL=y
