# Debug build: layered on prj.conf with
#   west build -p always -b nucleo_h723zg -- -DEXTRA_CONF_FILE=debug.conf
# Same build dir (build/); rebuild without it for the normal -Os image.

# -Og: single-stepping follows the source, locals stay visible
CONFIG_DEBUG_OPTIMIZATIONS=y

# Thread list/stack info for debugger RTOS views (OpenOCD "Zephyr" awareness)
CONFIG_DEBUG_THREAD_INFO=y

# __ASSERT() checks in the kernel and drivers: a failed assert prints file:line
CONFIG_ASSERT=y

# Stack usage per thread ("kernel stacks" in the shell); catches near-overflows
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
